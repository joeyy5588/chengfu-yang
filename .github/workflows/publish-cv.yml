name: Publish latest CV PDF

on:
  push:
    branches: [main]
    paths:
      - 'cv-source.tex'
      - '.github/workflows/publish-cv.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: cv-pdf-publish
  cancel-in-progress: false

jobs:
  build-and-publish-cv:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: https://joeyy5588.github.io/chengfu-yang/
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install LaTeX
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends texlive-latex-extra texlive-fonts-recommended texlive-publishers
      - name: Compile latest CV
        run: |
          mkdir -p /tmp/cv-build
          pdflatex -interaction=nonstopmode -halt-on-error -output-directory=/tmp/cv-build cv-source.tex
          pdflatex -interaction=nonstopmode -halt-on-error -output-directory=/tmp/cv-build cv-source.tex
          test -s /tmp/cv-build/cv-source.pdf
          cp /tmp/cv-build/cv-source.pdf content/cfyang_cv.pdf
          pdfinfo content/cfyang_cv.pdf | grep Pages
      - name: Commit updated PDF to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/cfyang_cv.pdf
          if ! git diff --staged --quiet; then
            git commit -m "Update published CV PDF from October 2026 LaTeX source"
            git push origin HEAD:main
          fi
      - name: Upload updated static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy updated site
        id: deployment
        uses: actions/deploy-pages@v4
